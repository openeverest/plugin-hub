apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugin-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plugin-hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "plugin-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.openshift.requiredSCC }}
      annotations:
        # OpenShift >= 4.14 admits the pod only under this SCC. Other clusters
        # ignore it.
        openshift.io/required-scc: {{ . | quote }}
      {{- end }}
      labels:
        {{- include "plugin-hub.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.installer.enabled }}
      serviceAccountName: {{ include "plugin-hub.fullname" . }}-installer
      {{- end }}
      # No fixed runAsUser/runAsGroup: the image runs as USER 65532:65532, and
      # OpenShift's restricted-v2 SCC assigns a UID from the namespace range.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # The installer keeps the Helm SDK cache under /tmp/helm.
        - name: tmp
          emptyDir: {}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.everestAPIURL }}
            - name: EVEREST_API_URL
              value: {{ .Values.everestAPIURL | quote }}
            {{- end }}
            {{- if .Values.hubIndexURL }}
            - name: HUB_INDEX_URL
              value: {{ .Values.hubIndexURL | quote }}
            {{- end }}
            {{- if .Values.cacheTTLSeconds }}
            - name: CACHE_TTL_SECONDS
              value: {{ .Values.cacheTTLSeconds | quote }}
            {{- end }}
            {{- if .Values.clusterName }}
            - name: EVEREST_CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            {{- end }}
            {{- if .Values.installer.enabled }}
            - name: INSTALLER_ENABLED
              value: "true"
            - name: PLUGIN_HUB_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
