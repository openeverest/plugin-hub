replicaCount: 1

image:
  repository: ghcr.io/openeverest/plugin-hub
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

plugin:
  displayName: "Plugin Hub"
  description: "Browse available OpenEverest plugins and providers from the official hub catalog and see which are installed on this cluster."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  extensionPoints:
    - type: route
      path: /plugin-hub
      label: Plugin Hub
    - type: sidebarItem
      path: /plugin-hub
      label: Plugin Hub
      icon: "/icon.png"

# Optional override for the Everest API URL. When left empty the backend
# targets the stable in-cluster DNS name
# (http://everest.everest-system.svc.cluster.local:8080), which always
# resolves to the live ClusterIP. Only set this for local dev or when everest
# runs under a non-standard name/namespace.
everestAPIURL: ""

# Override the catalog index URL. Defaults to the official OpenEverest hub.
hubIndexURL: ""

# Catalog cache TTL in seconds. Defaults to 300 (5 minutes) when empty.
cacheTTLSeconds: ""

# Cluster identifier used in /v1/clusters/{cluster}/providers when listing
# installed providers. Defaults to "main" when empty.
clusterName: ""

# One-click install / upgrade / uninstall of hub extensions from the UI. OPT-IN.
#
# WARNING: enabling this binds the plugin-hub pod's ServiceAccount to
# `installer.clusterRole` (cluster-admin by default) — providers ship CRDs and
# ClusterRoles, so installing them needs cluster-wide rights. Anyone who can
# change this plugin's image or `hubIndexURL` effectively gains those rights.
# In-app, only OpenEverest admins (users allowed to create plugins) can trigger
# installs. Disable again with `--set installer.enabled=false`; this removes
# the RBAC binding.
installer:
  enabled: false
  clusterRole: cluster-admin

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
