replicaCount: 1

image:
  repository: ghcr.io/openeverest/plugin-hub
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

plugin:
  displayName: "Plugin Hub"
  description: "Browse available OpenEverest plugins and providers from the official hub catalog and see which are installed on this cluster."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  extensionPoints:
    - type: route
      path: /plugin-hub
      label: Plugin Hub
    - type: sidebarItem
      path: /plugin-hub
      label: Plugin Hub
      icon: "/icon.png"

# Optional override for the Everest API URL. When left empty the backend
# targets the stable in-cluster DNS name
# (http://everest.everest-system.svc.cluster.local:8080), which always
# resolves to the live ClusterIP. Only set this for local dev or when everest
# runs under a non-standard name/namespace.
everestAPIURL: ""

# Override the catalog index URL. Defaults to the official OpenEverest hub.
hubIndexURL: ""

# Air-gapped support: mount a pre-populated catalog index from an existing
# ConfigMap instead of fetching hubIndexURL from GitHub. Leave configMapName
# empty to keep the default network fetch. The ConfigMap must contain a key
# (see `key` below) holding the same JSON shape as the upstream hub index.
# When set, this takes precedence over hubIndexURL.
localIndex:
  configMapName: ""
  key: index.json

# Catalog cache TTL in seconds. Defaults to 300 (5 minutes) when empty.
cacheTTLSeconds: ""

# Cluster identifier used in /v1/clusters/{cluster}/providers when listing
# installed providers. Defaults to "main" when empty.
clusterName: ""

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
