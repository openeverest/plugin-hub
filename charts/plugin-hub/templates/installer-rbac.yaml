{{- if .Values.installer.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plugin-hub.fullname" . }}-installer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plugin-hub.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "plugin-hub.fullname" . }}-installer
  labels:
    {{- include "plugin-hub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.installer.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ include "plugin-hub.fullname" . }}-installer
    namespace: {{ .Release.Namespace }}
{{- end }}
